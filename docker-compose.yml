services:
  certbot:
    build:
      context: .
    image: dusnm1/certbot-namecheap-dns-plugin:latest
    restart: unless-stopped
    environment:
      # --- Namecheap API ---
      NAMECHEAP_API_USER: your-namecheap-user
      NAMECHEAP_API_KEY: ${NAMECHEAP_API_KEY}   # real value lives in .env (git-ignored)
      NAMECHEAP_USERNAME: ""                    # defaults to NAMECHEAP_API_USER
      NAMECHEAP_CLIENT_IP: 203.0.113.10
      NAMECHEAP_SANDBOX: "false"
      NAMECHEAP_PROPAGATION_SECONDS: "120"
      # --- Certbot ---
      CERTBOT_EMAIL: you@example.com
      # ";" separates certificates, "," separates names within one certificate
      CERTBOT_CERTS: "example.com,*.example.com"
      CERTBOT_STAGING: "false"                  # production Let's Encrypt (staging verified 2026-11-13)
      CERTBOT_KEY_TYPE: ecdsa
      CERTBOT_RENEW_INTERVAL: 12h
      CERTBOT_DEPLOY_HOOK: ""
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./lib:/var/lib/letsencrypt
      - ./logs:/var/log/letsencrypt
